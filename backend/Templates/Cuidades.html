<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudades - Sistema de Transporte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        
        .header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: white;
            border-bottom: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .menu-button {
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px 0;
        }
        
        .menu-bar {
            height: 3px;
            width: 100%;
            background-color: #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-bar:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        
        .menu-button.active .menu-bar:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-bar:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }
        
        .nav-button {
            background: none;
            border: none;
            color: #FFDB99;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
            text-decoration: none;
        }
        
        .nav-button:hover {
            background-color: rgba(255, 219, 153, 0.1);
        }
        
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 150px;
            background-color: #FFDB99;
            transform: translateX(-150px);
            transition: transform 0.3s ease;
            position: relative;
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar.visible {
            transform: translateX(0);
        }
        
        .sidebar-button {
            background: none;
            border: none;
            padding: 12px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            color: #333;
            font-weight: 500;
            transition: background-color 0.2s;
            text-decoration: none;
            display: block;
        }
        
        .sidebar-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .page-title {
            color: #FFB84D;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .add-button {
            background: none;
            border: none;
            color: #FFDB99;
            cursor: pointer;
            margin-bottom: 20px;
            align-self: flex-start;
            font-weight: bold;
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background-color: #FFDB99;
            color: white;
            font-weight: bold;
        }
        
        tr:hover {
            background-color: #f9f9f9;
        }
        
        .action-button {
            background: none;
            border: none;
            color: #FFB84D;
            cursor: pointer;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .action-button.delete {
            color: #ff6b6b;
        }

        /* Estilos para los modales */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: auto;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 8px;
            width: 50%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            color: #FFB84D;
            font-size: 20px;
            font-weight: bold;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, 
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        select[multiple] {
            height: 120px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            text-align: right;
        }

        .btn {
            padding: 8px 16px;
            margin-left: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #FFDB99;
            color: white;
        }

        .btn-secondary {
            background-color: #f0f0f0;
        }

        .btn-danger {
            background-color: #ff6b6b;
            color: white;
        }

        .error-message {
            color: #ff6b6b;
            margin: 10px 0;
            font-size: 14px;
        }

        small {
            font-size: 12px;
            color: #777;
            display: block;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .modal-content {
                width: 90%;
                margin: 10% auto;
                max-height: 90vh;
            }
            
            .sidebar {
                width: 100%;
                max-width: none;
                height: auto;
                transform: translateY(-100%);
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            
            .sidebar.visible {
                transform: translateY(0);
            }
            
            .sidebar-button {
                white-space: nowrap;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="menu-button" id="menuButton">
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
        </button>
        <a href="/" class="nav-button">Inicio</a>
    </div>
    
    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <a href="/Camioneros" class="sidebar-button">Camioneros</a>
            <a href="/Camiones" class="sidebar-button">Camiones</a>
            <a href="/Ciudades" class="sidebar-button active">Ciudades</a>
            <a href="/Paquetes" class="sidebar-button">Paquetes</a>
            <a href="/consultas" class="sidebar-button">Consultas</a>
        </div>
        
        <div class="content">
            <h1 class="page-title">Ciudades</h1>
            
            <button class="add-button" id="addButton">Agregar Ciudad</button>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Código Postal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Ejemplo de fila de datos -->
                        <tr>
                            <td>1</td>
                            <td>Ciudad de México</td>
                            <td>01000</td>
                            <td>
                                <button class="action-button">Editar</button>
                                <button class="action-button delete">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Guadalajara</td>
                            <td>44100</td>
                            <td>
                                <button class="action-button">Editar</button>
                                <button class="action-button delete">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Monterrey</td>
                            <td>64000</td>
                            <td>
                                <button class="action-button">Editar</button>
                                <button class="action-button delete">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar Ciudad -->
    <div id="modalAgregar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Agregar Nueva Ciudad</h2>
                <span class="close" onclick="cerrarModal('modalAgregar')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formAgregar" method="post" action="/ciudades/agregar">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="codigo_postal">Código Postal:</label>
                        <input type="text" id="codigo_postal" name="codigo_postal" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalAgregar')">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="document.getElementById('formAgregar').submit()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Ciudad -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Editar Ciudad</h2>
                <span class="close" onclick="cerrarModal('modalEditar')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formEditar" method="post">
                    <input type="hidden" id="edit_id" name="id">
                    <div class="form-group">
                        <label for="edit_nombre">Nombre:</label>
                        <input type="text" id="edit_nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="edit_codigo_postal">Código Postal:</label>
                        <input type="text" id="edit_codigo_postal" name="codigo_postal" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalEditar')">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="document.getElementById('formEditar').submit()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Modal para Confirmar Eliminación -->
    <div id="modalEliminar" class="modal">
        <div class="modal-content" style="width: 30%;">
            <div class="modal-header">
                <h2 class="modal-title">Confirmar Eliminación</h2>
                <span class="close" onclick="cerrarModal('modalEliminar')">&times;</span>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar esta ciudad?</p>
                <form id="formEliminar" method="post" style="display: none;">
                    <input type="hidden" id="delete_id" name="id">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalEliminar')">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="confirmarEliminar()">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        // Manejo del menú desplegable
        document.getElementById('menuButton').addEventListener('click', function() {
            this.classList.toggle('active');
            document.getElementById('sidebar').classList.toggle('visible');
        });

        // Funciones para los modales
        function abrirModalAgregar() {
            document.getElementById('formAgregar').reset();
            mostrarModal('modalAgregar');
        }

        function abrirModalEditar(id, nombre, codigoPostal) {
            document.getElementById('edit_id').value = id;
            document.getElementById('edit_nombre').value = nombre;
            document.getElementById('edit_codigo_postal').value = codigoPostal;
            
            // Configurar el formulario de edición
            document.getElementById('formEditar').action = `/ciudades/editar/${id}`;
            
            mostrarModal('modalEditar');
        }

        function abrirModalEliminar(id) {
            document.getElementById('delete_id').value = id;
            mostrarModal('modalEliminar');
        }

        function mostrarModal(modalId) {
            document.getElementById(modalId).style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function confirmarEliminar() {
            const id = document.getElementById('delete_id').value;
            document.getElementById('formEliminar').action = `/ciudades/eliminar/${id}`;
            document.getElementById('formEliminar').submit();
        }

        // Configurar botones
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('addButton').addEventListener('click', abrirModalAgregar);
            
            // Ejemplo de cómo se configurarían los botones de edición en las filas
            document.querySelectorAll('.action-button:not(.delete)').forEach(button => {
                button.addEventListener('click', function() {
                    const row = this.closest('tr');
                    const id = row.cells[0].textContent;
                    const nombre = row.cells[1].textContent;
                    const codigoPostal = row.cells[2].textContent;
                    
                    abrirModalEditar(id, nombre, codigoPostal);
                });
            });
            
            // Ejemplo de cómo se configurarían los botones de eliminar en las filas
            document.querySelectorAll('.action-button.delete').forEach(button => {
                button.addEventListener('click', function() {
                    const row = this.closest('tr');
                    const id = row.cells[0].textContent;
                    
                    abrirModalEliminar(id);
                });
            });
            
            // Cerrar modal al hacer clic fuera del contenido
            window.addEventListener('click', function(event) {
                if (event.target.classList.contains('modal')) {
                    cerrarModal(event.target.id);
                }
            });
        });

        // Evitar que el modal se cierre al hacer clic dentro del contenido
        document.querySelectorAll('.modal-content').forEach(modalContent => {
            modalContent.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
</body>
</html>
